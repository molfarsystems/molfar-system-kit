name: Build role PR

on:
  issues:
    types: [labeled]

# Two roles approved in the same second used to race: both runs branched off
# the same main and the second one's merge was rejected with "Base branch was
# modified". Queue them instead - the second run then starts from a main that
# already has the first role.
concurrency:
  group: add-role
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A project address, not actions@github.com: that one maps to the
      # third-party `actions-user` account, which then shows up in the
      # contributor list with an avatar we don't control. This address belongs
      # to no GitHub account, so the bot's commits stay unattributed and the
      # only bot in the list is github-actions[bot], from the merges.
      - name: Configure git
        run: |
          git config user.name "Molfar Kit Bot"
          git config user.email "bot@molfar.nova-hata.com"

      # The script reads the issue form to learn its field labels.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Build role folder and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/build_role_pr.py
