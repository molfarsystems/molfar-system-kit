name: Build role PR

on:
  issues:
    types: [labeled]

# One group PER ISSUE, deliberately - not one group for the workflow. A single
# shared group looks like it serialises approvals, but GitHub keeps only ONE
# run pending per group: label three issues at once and the third evicts the
# second, which is reported as "cancelled" and never builds its role.
#
# So runs are left to overlap, and the race they used to lose is handled where
# it actually happens - build_role_pr.py rebuilds the branch on the current
# main between merge attempts. This group only stops the same issue from being
# built twice over, e.g. on a fast unlabel/relabel.
concurrency:
  group: add-role-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A project address, not actions@github.com: that one maps to the
      # third-party `actions-user` account, which then shows up in the
      # contributor list with an avatar we don't control. This address belongs
      # to no GitHub account, so the bot's commits stay unattributed and the
      # only bot in the list is github-actions[bot], from the merges.
      - name: Configure git
        run: |
          git config user.name "Molfar Kit Bot"
          git config user.email "bot@molfar.nova-hata.com"

      # The script reads the issue form to learn its field labels.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Build role folder and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/build_role_pr.py
