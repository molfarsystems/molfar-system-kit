name: Build role PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "molfar-kit-bot"
          git config user.email "actions@github.com"

      # The script reads the issue form to learn its field labels.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Build role folder and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/build_role_pr.py
